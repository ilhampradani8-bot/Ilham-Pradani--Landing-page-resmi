<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - IP Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="header-placeholder"></div>

    <main class="pt-32 pb-24 px-6">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-black mb-12">Pengaturan Akun</h1>

            <div class="space-y-6">
                <!-- Profile Settings -->
                <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-8">Informasi Profil</h3>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Nama Lengkap</label>
                            <input type="text" value="User Name" class="user-name-display w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                            <input type="email" placeholder="email@contoh.com" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- App Settings -->
                <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-8">Preferensi Belajar</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center">
                                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                                </div>
                                <span class="font-bold">Suara Otomatis</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked class="sr-only peer">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center">
                                    <i data-lucide="bell" class="w-5 h-5"></i>
                                </div>
                                <span class="font-bold">Pengingat Harian</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked class="sr-only peer">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div class="bg-red-50 p-8 rounded-[2rem] border border-red-100">
                    <h3 class="text-xs font-black text-red-400 uppercase tracking-[0.2em] mb-6">Zona Berbahaya</h3>
                    <button onclick="logout()" class="w-full py-4 bg-red-600 text-white font-bold rounded-2xl shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="log-out" class="w-5 h-5"></i> Keluar dari Semua Sesi
                    </button>
                </div>
            </div>
            
            <div class="mt-12 flex justify-end">
                <button class="px-10 py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all">
                    Simpan Perubahan
                </button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/auth.js"></script>
    <script>
        fetch('include_learning/header.html').then(r => r.text()).then(d => {
            document.getElementById('header-placeholder').innerHTML = d;
            lucide.createIcons();
        });
        fetch('include_learning/footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
            lucide.createIcons();
        });

        function toggleMobileMenu(show) {
            const menu = document.getElementById('mobile-menu');
            if (show) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }
    </script>
</body>
</html>
