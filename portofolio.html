<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portofolio | Dr. Ilham Pradani C.L.</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="image/favicon.png">
    <link rel="apple-touch-icon" href="image/favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portofolio Lengkap - Dr. Ilham Pradani C.L.">
    <meta property="og:image" content="image/hero.jpg">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #ecf0f3;
            color: #1f2937;
        }

        .neu-card {
            background: #ecf0f3;
            box-shadow: 6px 6px 12px #c8d0e7, -6px -6px 12px #ffffff;
            border-radius: 20px;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neu-card:hover {
            box-shadow: 10px 10px 20px #b8c4df, -10px -10px 20px #ffffff;
            transform: translateY(-2px);
        }

        .neu-inset {
            background: #ecf0f3;
            box-shadow: inset 4px 4px 8px #c8d0e7, inset -4px -4px 8px #ffffff !important;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar for list container */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-[#ecf0f3] overflow-x-hidden text-gray-800">

    <div id="header-placeholder"></div>

    <main class="pt-24 sm:pt-28 pb-10 min-h-screen">
        <div class="w-full px-4 sm:px-8 lg:px-12 mx-auto">
            
            <!-- Page Header (clean, borderless) -->
            <div class="text-left mb-6 reveal-el">
                <div class="inline-flex items-center gap-3 mb-2">
                    <i data-lucide="briefcase" class="w-7 h-7 text-blue-600"></i>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight" data-t="portofolio_title">Eksplorasi Karya</h1>
                </div>
                <p class="text-gray-500 text-xs sm:text-sm max-w-3xl" data-t="portofolio_desc">
                    Implementasi teknis dari visi strategis dan solusi digital. Jelajahi proyek startup, sistem AI, dan karya arsitektur teknologi kami.
                </p>
            </div>

            <!-- Two-Column Interactive Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-6 lg:gap-8 items-start">
                
                <!-- Left Column: Filters and Project Sidebar List (Sticky) -->
                <div class="lg:sticky lg:top-24 flex flex-col gap-4 w-full">
                    
                    <!-- Dynamic Category Tabs Wrap with Arrows -->
                    <div class="relative flex items-center w-full border-b border-gray-300/40 pb-2">
                        <!-- Left Arrow -->
                        <button id="cat-scroll-left" class="hidden md:flex shrink-0 w-6 h-6 items-center justify-center rounded-full bg-[#ecf0f3] shadow-[1px_1px_3px_#b8bec9,-1px_-1px_3px_#ffffff] text-gray-500 hover:text-blue-600 active:scale-95 transition-all mr-1.5" aria-label="Scroll Categories Left">
                            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                        </button>
                        
                        <!-- Dynamic Category Tabs -->
                        <div id="category-tabs" class="flex flex-row overflow-x-auto gap-2 hide-scrollbar w-full scroll-smooth">
                            <!-- Categories will load here -->
                        </div>
                        
                        <!-- Right Arrow -->
                        <button id="cat-scroll-right" class="hidden md:flex shrink-0 w-6 h-6 items-center justify-center rounded-full bg-[#ecf0f3] shadow-[1px_1px_3px_#b8bec9,-1px_-1px_3px_#ffffff] text-gray-500 hover:text-blue-600 active:scale-95 transition-all ml-1.5" aria-label="Scroll Categories Right">
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    
                    <!-- Project List Box: Horizontal Scroll on Mobile, Vertical Scroll on Desktop -->
                    <div class="flex flex-row lg:flex-col gap-3.5 overflow-x-auto lg:overflow-x-visible lg:overflow-y-auto pb-4 lg:pb-0 lg:max-h-[calc(100vh-240px)] pr-0 lg:pr-2 custom-scrollbar w-full" id="project-list">
                        <!-- Skeleton Loaders -->
                        <div class="p-4 bg-white/10 rounded-2xl border border-white/20 animate-pulse flex items-center gap-4 shrink-0 w-[280px] lg:w-auto">
                            <div class="w-12 h-12 bg-gray-300 rounded-xl"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-3 bg-gray-300 rounded w-1/3"></div>
                                <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                            </div>
                        </div>
                        <div class="p-4 bg-white/10 rounded-2xl border border-white/20 animate-pulse flex items-center gap-4 shrink-0 w-[280px] lg:w-auto">
                            <div class="w-12 h-12 bg-gray-300 rounded-xl"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-3 bg-gray-300 rounded w-1/3"></div>
                                <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Interactive Details Panel (Borderless, Full-Width edge-to-edge - Sticky on Desktop) -->
                <div class="w-full flex flex-col justify-between h-[calc(100vh-320px)] lg:h-[calc(100vh-160px)] min-h-[500px] lg:min-h-[640px] mt-4 lg:mt-0 lg:sticky lg:top-24">
                    
                    <!-- Metadata Header -->
                    <div class="pb-3.5 mb-3.5 border-b border-gray-300/60">
                        <span id="viewer-cat" class="text-[10px] font-black text-blue-600 uppercase tracking-widest block mb-1">Kategori</span>
                        <h2 id="viewer-title" class="text-lg sm:text-xl font-extrabold text-gray-900 mb-2 leading-tight">Memuat Proyek...</h2>
                        <div id="viewer-tags" class="flex flex-wrap gap-1.5 mb-2">
                            <!-- Tech badges will be injected here -->
                        </div>
                        <p id="viewer-desc" class="text-gray-500 text-xs leading-relaxed max-w-4xl line-clamp-3 lg:line-clamp-none"></p>
                    </div>

                    <!-- Browser Mockup Container -->
                    <div class="flex-1 flex flex-col relative bg-white/40 rounded-2xl overflow-hidden border border-gray-300/40 shadow-inner">
                        <!-- Loading Spinner -->
                        <div id="viewer-loading" class="absolute inset-0 bg-[#ecf0f3] flex flex-col items-center justify-center gap-3 z-10 transition-opacity duration-300">
                            <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Memuat Gambar Proyek...</span>
                        </div>

                        <!-- Showcase Image -->
                        <div id="viewer-img-container" class="w-full h-full overflow-y-auto flex items-center justify-center p-4 bg-gray-900/5">
                            <img id="viewer-img-preview" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-md border border-gray-200" alt="Preview Proyek">
                        </div>
                    </div>

                    <!-- Footer Action Bar -->
                    <div class="mt-4 pt-3.5 border-t border-gray-300/60 flex justify-between items-center">
                        <div class="flex items-center gap-1.5 text-blue-600 font-bold text-xs">
                            <i data-lucide="shield-check" class="w-4 h-4"></i> Terverifikasi Kepatuhan & Keamanan
                        </div>
                        <div class="flex items-center gap-3">
                            <!-- Prev/Next PC/Desktop Navigation Arrows -->
                            <div class="hidden md:flex items-center gap-2">
                                <button id="prev-proj" class="w-8 h-8 rounded-xl bg-[#ecf0f3] shadow-[3px_3px_6px_#b8bec9,-3px_-3px_6px_#ffffff] hover:shadow-[inset_2px_2px_4px_#b8bec9,inset_-2px_-2px_4px_#ffffff] active:scale-95 flex items-center justify-center text-gray-600 transition-all" aria-label="Previous Project">
                                    <i data-lucide="chevron-left" class="w-4.5 h-4.5"></i>
                                </button>
                                <button id="next-proj" class="w-8 h-8 rounded-xl bg-[#ecf0f3] shadow-[3px_3px_6px_#b8bec9,-3px_-3px_6px_#ffffff] hover:shadow-[inset_2px_2px_4px_#b8bec9,inset_-2px_-2px_4px_#ffffff] active:scale-95 flex items-center justify-center text-gray-600 transition-all" aria-label="Next Project">
                                    <i data-lucide="chevron-right" class="w-4.5 h-4.5"></i>
                                </button>
                            </div>
                            <a id="viewer-link" href="" target="_blank" class="px-4 sm:px-5 py-2 sm:py-2.5 bg-[#ecf0f3] text-blue-600 shadow-[3px_3px_6px_#b8bec9,-3px_-3px_6px_#ffffff] hover:shadow-[inset_2px_2px_4px_#b8bec9,inset_-2px_-2px_4px_#ffffff] rounded-xl text-[10px] sm:text-xs font-black uppercase transition-all duration-300 flex items-center gap-2">
                                Kunjungi Website <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/portofolio.js"></script>
</body>
</html>
